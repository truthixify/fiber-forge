name: ci
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --engine-strict
      - run: npm audit --omit=dev --audit-level=high
      - run: make ci

  runtime-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - run: npm run test:runtime

  required:
    name: required
    if: always()
    needs: [ci, runtime-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Verify source checks
        env:
          SOURCE_RESULT: ${{ needs.ci.result }}
          RUNTIME_RESULT: ${{ needs.runtime-compatibility.result }}
        run: |
          if [ "$SOURCE_RESULT" != "success" ] || [ "$RUNTIME_RESULT" != "success" ]; then
            echo "source checks failed: ci=$SOURCE_RESULT runtime-compatibility=$RUNTIME_RESULT" >&2
            exit 1
          fi
