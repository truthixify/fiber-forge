name: cch-e2e

# Optional CCH dependencies are isolated from the ordinary Fiber live gate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cch-e2e.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/live-evidence.mjs"
      - "assets/**"
      - "src/cch.ts"
      - "src/ckb.ts"
      - "src/config.ts"
      - "src/engine.ts"
      - "src/lightning.ts"
      - "src/orchestrator.ts"
      - "src/package-metadata.ts"
      - "src/ports.ts"
      - "src/presets.ts"
      - "src/rpc.ts"
      - "src/topology.ts"
      - "test/cch.test.ts"
      - "test/cch-status.test.ts"
      - "test/lightning-e2e.test.ts"
      - "test/cch-topology-e2e.test.ts"

permissions:
  contents: read

concurrency:
  group: cch-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cch-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-pull pinned CCH dependency images
        timeout-minutes: 8
        run: node scripts/live-evidence.mjs pull-cch-images
      - run: npm run build
      - name: Verify the real Bitcoin/LND lifecycle
        timeout-minutes: 6
        env:
          FORGE_LIGHTNING_E2E: "1"
        run: npx vitest run test/lightning-e2e.test.ts --reporter=verbose
      - name: Verify the integrated CCH topology and cleanup
        timeout-minutes: 12
        env:
          FORGE_CCH_TOPOLOGY_E2E: "1"
        run: npx vitest run test/cch-topology-e2e.test.ts --reporter=verbose
