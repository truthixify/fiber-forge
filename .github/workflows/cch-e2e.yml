name: cch-e2e

# Optional CCH dependencies are isolated from the ordinary Fiber live gate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cch-e2e.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/live-evidence.mjs"
      - "scripts/cch-evidence.mjs"
      - "scripts/cch-packed-runner.mjs"
      - "bin/**"
      - "assets/**"
      - "src/cch.ts"
      - "src/cch-proof.ts"
      - "src/ckb.ts"
      - "src/cli.ts"
      - "src/config.ts"
      - "src/engine.ts"
      - "src/errors.ts"
      - "src/lightning.ts"
      - "src/orchestrator.ts"
      - "src/package-metadata.ts"
      - "src/ports.ts"
      - "src/presets.ts"
      - "src/rpc.ts"
      - "src/sdk.ts"
      - "src/topology.ts"
      - "test/cch.test.ts"
      - "test/cch-proof.test.ts"
      - "test/cch-evidence.test.mjs"
      - "test/cch-status.test.ts"
      - "test/lightning-e2e.test.ts"
      - "test/cch-topology-e2e.test.ts"

permissions:
  contents: read

concurrency:
  group: cch-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cch-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORGE_CCH_E2E_ARTIFACT_DIR: artifacts/cch-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-pull pinned CCH dependency images
        timeout-minutes: 8
        run: node scripts/live-evidence.mjs pull-cch-images
      - run: npm run build
      - name: Run the packed two-direction proof twice
        timeout-minutes: 30
        run: node scripts/cch-evidence.mjs
      - name: Upload bounded CCH evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cch-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cch-e2e/summary.json
            artifacts/cch-e2e/summary.md
            artifacts/cch-e2e/diagnostics.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
