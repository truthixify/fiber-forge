name: e2e
# Headless live smoke: brings real CKB + fnn containers up on the runner's Docker, drives a
# three-node CKB multi-hop payment, node recovery, rollback failures, and UDT paths, then verifies
# teardown. Kept off the per-push path (slow: pulls images + boots a devnet) — run it on demand or
# weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: pre-pull images
        run: |
          docker pull nervos/ckb:v0.201.0
          docker pull nervos/fiber:0.9.0-rc7
      - name: live e2e
        env:
          FORGE_E2E: "1"
        run: npx vitest run test/e2e.test.ts
