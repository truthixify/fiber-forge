name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish from the selected ref
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  live-e2e:
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: live-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - id: release
        name: verify release metadata
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const releaseVersion = process.env.RELEASE_VERSION.replace(/^v/, "");
          if (version !== releaseVersion) {
            throw new Error(`release ${process.env.RELEASE_VERSION} does not match package version ${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${version.includes("-") ? "next" : "latest"}\n`);
          NODE
      - name: verify source and packed artifact
        run: make ci
      - name: publish package
        run: npm publish --tag "${{ steps.release.outputs.npm-tag }}"
