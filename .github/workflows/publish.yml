name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish from the selected ref
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      npm-tag: ${{ steps.release.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - id: release
        name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const releaseVersion = process.env.RELEASE_VERSION.replace(/^v/, "");
          if (version !== releaseVersion) {
            throw new Error(`release ${process.env.RELEASE_VERSION} does not match package version ${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${version.includes("-") ? "next" : "latest"}\n`);
          NODE

  source-ci:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --engine-strict
      - run: npm audit --omit=dev --audit-level=high
      - run: make ci

  live-e2e:
    needs: metadata
    uses: ./.github/workflows/e2e.yml

  cch-e2e:
    needs: metadata
    uses: ./.github/workflows/cch-e2e.yml

  publish:
    needs: [metadata, source-ci, live-e2e, cch-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --engine-strict
      - name: publish package
        run: npm publish --tag "${{ needs.metadata.outputs.npm-tag }}"
