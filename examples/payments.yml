# A checked payment scenario for examples/topology.yml.
# Run with: fiber-forge up examples/topology.yml --no-gui
#           fiber-forge run my-net examples/payments.yml
#
# The whole list repeats `loop` times and each payment must settle successfully.
version: 1
loop: 3
steps:
  - pay: { from: alice, to: carol, amount: 100 }
    expect: { payment_status: Success }
  - wait: 800
  - pay: { from: bob, to: carol, amount: 50, description: coffee }
    expect: { payment_status: Success }
  - wait: 800
  - fund: { node: alice, amount: 5000 }
  - pay: { from: carol, to: alice, amount: 25 }
    expect: { payment_status: Success }
  - wait: 1200
