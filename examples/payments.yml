# A sample fiber-forge scenario: a little payment traffic over a running network.
# Run with:  fiber-forge run <net> examples/payments.yml
#
# Each step is exactly one action: pay / open / close / fund / invoice / wait (ms).
# The whole list repeats `loop` times.
loop: 3
steps:
  - pay: { from: feynman, to: curie, amount: 100 }
  - wait: 800
  - pay: { from: curie, to: tesla, amount: 50, description: coffee }
  - wait: 800
  - fund: { node: feynman, amount: 5000 }
  - pay: { from: tesla, to: feynman, amount: 25 }
  - wait: 1200
